<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="460" fill="#fff"/><rect x="10" y="10" width="318" height="218" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="89.0" y="10" width="160" height="34" fill="#a3833f"/><text x="169.0" y="34.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Motivation</text><text x="22.0" y="64.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="64.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Weather Hurts Cameras</text><text x="46.0" y="84.0" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="start">•</text><text x="60.0" y="84.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Detectors are trained on</text><text x="60.0" y="102.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">clear-weather data</text><text x="46.0" y="120.0" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="start">•</text><text x="60.0" y="120.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Accuracy drops in rain, fog, and</text><text x="60.0" y="138.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">snow</text><text x="22.0" y="164.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="164.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Safety Need</text><text x="46.0" y="184.0" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="start">•</text><text x="60.0" y="184.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Perception must stay reliable when</text><text x="60.0" y="202.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">it matters most</text><rect x="10" y="240" width="318" height="210" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="94.0" y="240" width="150" height="34" fill="#a3833f"/><text x="169.0" y="264.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Takeaways</text><text x="22.0" y="296.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="296.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Adverse Weather</text><text x="40.0" y="316.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Keeps detection reliable in rain,</text><text x="40.0" y="334.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">fog, and snow</text><text x="22.0" y="360.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="360.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Edge Computing</text><text x="40.0" y="380.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Presented at ACM/IEEE SEC 2025,</text><text x="40.0" y="398.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Arlington, VA</text><rect x="340" y="10" width="550" height="218" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="530.0" y="10" width="170" height="34" fill="#a3833f"/><text x="615.0" y="34.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Methodology</text><rect x="350" y="48" width="530" height="176" rx="8" fill="#dbe6f4"/><rect x="354.0" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(410.2,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-10 2a6 6 0 0 1 0-12 9 9 0 0 1 17-1 6 6 0 0 1 3 12z"/><path d="M-6 7l-2 5M0 7l-2 5M6 7l-2 5"/></g><text x="410.2" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Camera Frames</text><path d="M364.0 130.0 H456.5" stroke="#1f3f77" stroke-width="1.1"/><text x="410.2" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Rain, fog, and</text><text x="410.2" y="162.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">snow</text><path d="M469.5 136.0 H481.5" stroke="#1f3f77" stroke-width="3"/><path d="M479.5 130.0 L488.5 136.0 L479.5 142.0 Z" fill="#1f3f77"/><rect x="490.5" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(546.8,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 0s5-9 14-9 14 9 14 9-5 9-14 9-14-9-14-9z"/><circle r="4"/></g><text x="546.8" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">VLM Reasoning</text><path d="M500.5 130.0 H593.0" stroke="#1f3f77" stroke-width="1.1"/><text x="546.8" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Reads weather and</text><text x="546.8" y="162.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">visibility</text><path d="M606.0 136.0 H618.0" stroke="#1f3f77" stroke-width="3"/><path d="M616.0 130.0 L625.0 136.0 L616.0 142.0 Z" fill="#1f3f77"/><rect x="627.0" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(683.2,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -12l13 7-13 7-13-7zM-13 1l13 7 13-7M-13 7l13 7 13-7"/></g><text x="683.2" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Context Signal</text><path d="M637.0 130.0 H729.5" stroke="#1f3f77" stroke-width="1.1"/><text x="683.2" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Conditions</text><text x="683.2" y="162.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">changed</text><path d="M742.5 136.0 H754.5" stroke="#1f3f77" stroke-width="3"/><path d="M752.5 130.0 L761.5 136.0 L752.5 142.0 Z" fill="#1f3f77"/><rect x="763.5" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(819.8,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 -10h6M6 -10h6v6M12 4v6H6M-6 10h-6V4M-12 -4v-6"/><circle r="3"/></g><text x="819.8" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Adapted</text><text x="819.8" y="139.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Detection</text><path d="M773.5 147.0 H866.0" stroke="#1f3f77" stroke-width="1.1"/><text x="819.8" y="164.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Tuned to the</text><text x="819.8" y="179.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">scene</text><rect x="340" y="240" width="550" height="210" fill="#efefef" stroke="#8b7d63" stroke-width="1.6"/><rect x="525.0" y="240" width="180" height="34" fill="#a3833f"/><text x="615.0" y="264.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Key Findings</text><rect x="354" y="286" width="522" height="50" rx="8" fill="#fff" stroke="#9aa3ad"/><text x="366.0" y="305.0" font-size="14" font-weight="700" fill="#1b1f24" text-anchor="start">F1:</text><text x="398.0" y="305.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Vision-language models read weather and visibility context</text><text x="366.0" y="323.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">directly from the driving scene.</text><rect x="354" y="344" width="522" height="50" rx="8" fill="#fff" stroke="#9aa3ad"/><text x="366.0" y="363.0" font-size="14" font-weight="700" fill="#1b1f24" text-anchor="start">F2:</text><text x="398.0" y="363.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Object detection adapts to that context instead of assuming clear</text><text x="366.0" y="381.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">weather.</text><path d="M370 402 H876 V458 H354 Z" fill="#1d5a3a"/><text x="380.0" y="425.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Context-aware, all-weather perception for autonomous</text><text x="380.0" y="445.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">driving.</text></svg>