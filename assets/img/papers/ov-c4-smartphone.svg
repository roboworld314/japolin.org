<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="460" fill="#fff"/><rect x="10" y="10" width="318" height="218" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="89.0" y="10" width="160" height="34" fill="#a3833f"/><text x="169.0" y="34.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Motivation</text><text x="22.0" y="64.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="64.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Phones Reflect Identity</text><text x="46.0" y="84.0" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="start">•</text><text x="60.0" y="84.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Usage patterns reveal a user's</text><text x="60.0" y="102.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">behaviour</text><text x="22.0" y="128.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="128.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Why It Matters</text><text x="46.0" y="148.0" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="start">•</text><text x="60.0" y="148.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Security, biometric, and privacy</text><text x="60.0" y="166.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">applications</text><rect x="10" y="240" width="318" height="210" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="94.0" y="240" width="150" height="34" fill="#a3833f"/><text x="169.0" y="264.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Takeaways</text><text x="22.0" y="296.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="296.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Usage Factors</text><text x="40.0" y="316.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Identified the usage traits that</text><text x="40.0" y="334.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">predict gender</text><text x="22.0" y="360.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="360.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Privacy Awareness</text><text x="40.0" y="380.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Highlights security and privacy</text><text x="40.0" y="398.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">concerns</text><rect x="340" y="10" width="550" height="218" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="530.0" y="10" width="170" height="34" fill="#a3833f"/><text x="615.0" y="34.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Methodology</text><rect x="350" y="48" width="530" height="176" rx="8" fill="#dbe6f4"/><rect x="354.0" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(410.2,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-11" y="-14" width="22" height="28" rx="3"/><path d="M-5 -14v-3h10v3M-6 -5h12M-6 1h12M-6 7h7"/></g><text x="410.2" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Survey Data</text><path d="M364.0 130.0 H456.5" stroke="#1f3f77" stroke-width="1.1"/><text x="410.2" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">1,284 users aged</text><text x="410.2" y="162.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">18 to 30</text><path d="M469.5 136.0 H481.5" stroke="#1f3f77" stroke-width="3"/><path d="M479.5 130.0 L488.5 136.0 L479.5 142.0 Z" fill="#1f3f77"/><rect x="490.5" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(546.8,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-8" y="-14" width="16" height="28" rx="3"/><path d="M-3 10h6"/></g><text x="546.8" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Usage Features</text><path d="M500.5 130.0 H593.0" stroke="#1f3f77" stroke-width="1.1"/><text x="546.8" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Usage pattern,</text><text x="546.8" y="162.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">gender label</text><path d="M606.0 136.0 H618.0" stroke="#1f3f77" stroke-width="3"/><path d="M616.0 130.0 L625.0 136.0 L616.0 142.0 Z" fill="#1f3f77"/><rect x="627.0" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(683.2,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-9" cy="-7" r="3"/><circle cx="-9" cy="7" r="3"/><circle cx="9" cy="0" r="3"/><circle cx="0" cy="-11" r="2.5"/><circle cx="0" cy="11" r="2.5"/><path d="M-6 -7l12 6M-6 7l12-6M-7 -9l5-1M-7 9l5 1"/></g><text x="683.2" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">10 Algorithms</text><path d="M637.0 130.0 H729.5" stroke="#1f3f77" stroke-width="1.1"/><text x="683.2" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Five classifier</text><text x="683.2" y="162.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">families</text><path d="M742.5 136.0 H754.5" stroke="#1f3f77" stroke-width="3"/><path d="M752.5 130.0 L761.5 136.0 L752.5 142.0 Z" fill="#1f3f77"/><rect x="763.5" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(819.8,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-13 12h26M-9 12V2M-2 12V-6M5 12V-1M12 12V-11"/></g><text x="819.8" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Evaluation</text><path d="M773.5 130.0 H866.0" stroke="#1f3f77" stroke-width="1.1"/><text x="819.8" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Accuracy,</text><text x="819.8" y="162.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">precision,</text><text x="819.8" y="177.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">recall, F-score</text><rect x="340" y="240" width="550" height="210" fill="#efefef" stroke="#8b7d63" stroke-width="1.6"/><rect x="525.0" y="240" width="180" height="34" fill="#a3833f"/><text x="615.0" y="264.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Key Findings</text><rect x="354" y="286" width="522" height="32" rx="8" fill="#fff" stroke="#9aa3ad"/><text x="366.0" y="305.0" font-size="14" font-weight="700" fill="#1b1f24" text-anchor="start">F1:</text><text x="398.0" y="305.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Smartphone usage patterns can predict the gender of the user.</text><rect x="354" y="326" width="522" height="32" rx="8" fill="#fff" stroke="#9aa3ad"/><text x="366.0" y="345.0" font-size="14" font-weight="700" fill="#1b1f24" text-anchor="start">F2:</text><text x="398.0" y="345.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Random forest performed best among ten algorithms.</text><path d="M370 366 H876 V402 H354 Z" fill="#1d5a3a"/><text x="380.0" y="389.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Random forest reaches about 84.11% accuracy.</text></svg>