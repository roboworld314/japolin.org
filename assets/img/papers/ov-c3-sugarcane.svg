<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="460" fill="#fff"/><rect x="10" y="10" width="318" height="218" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="89.0" y="10" width="160" height="34" fill="#a3833f"/><text x="169.0" y="34.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Motivation</text><text x="22.0" y="64.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="64.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Key Crop for Bangladesh</text><text x="46.0" y="84.0" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="start">•</text><text x="60.0" y="84.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">The country's sole source of white</text><text x="60.0" y="102.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">sugar</text><text x="46.0" y="120.0" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="start">•</text><text x="60.0" y="120.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Also used for biofuels</text><text x="22.0" y="146.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="146.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Planning Needs</text><text x="46.0" y="166.0" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="start">•</text><text x="60.0" y="166.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Reliable yield forecasts for</text><text x="60.0" y="184.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">growers and industry</text><rect x="10" y="240" width="318" height="210" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="94.0" y="240" width="150" height="34" fill="#a3833f"/><text x="169.0" y="264.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Takeaways</text><text x="22.0" y="296.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="296.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Informed Decisions</text><text x="40.0" y="316.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">For farmers, policymakers, and the</text><text x="40.0" y="334.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">sugar industry</text><text x="22.0" y="360.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="360.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Broader Use</text><text x="40.0" y="380.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Approach can extend to other regions</text><text x="40.0" y="398.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">and crops</text><rect x="340" y="10" width="550" height="218" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="530.0" y="10" width="170" height="34" fill="#a3833f"/><text x="615.0" y="34.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Methodology</text><rect x="350" y="48" width="530" height="176" rx="8" fill="#dbe6f4"/><rect x="354.0" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(410.2,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-10 6a6 6 0 0 1 0-12 9 9 0 0 1 17-1 6 6 0 0 1 3 12z"/></g><text x="410.2" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Data</text><text x="410.2" y="139.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Collection</text><path d="M364.0 147.0 H456.5" stroke="#1f3f77" stroke-width="1.1"/><text x="410.2" y="164.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Weather (BMD),</text><text x="410.2" y="179.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">yield (BBS)</text><path d="M469.5 136.0 H481.5" stroke="#1f3f77" stroke-width="3"/><path d="M479.5 130.0 L488.5 136.0 L479.5 142.0 Z" fill="#1f3f77"/><rect x="490.5" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(546.8,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-9" cy="-7" r="3"/><circle cx="-9" cy="7" r="3"/><circle cx="9" cy="0" r="3"/><circle cx="0" cy="-11" r="2.5"/><circle cx="0" cy="11" r="2.5"/><path d="M-6 -7l12 6M-6 7l12-6M-7 -9l5-1M-7 9l5 1"/></g><text x="546.8" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Five</text><text x="546.8" y="139.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Regressors</text><path d="M500.5 147.0 H593.0" stroke="#1f3f77" stroke-width="1.1"/><text x="546.8" y="164.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">LR, GBR, DTR,</text><text x="546.8" y="179.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">RFR, XGBR</text><path d="M606.0 136.0 H618.0" stroke="#1f3f77" stroke-width="3"/><path d="M616.0 130.0 L625.0 136.0 L616.0 142.0 Z" fill="#1f3f77"/><rect x="627.0" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(683.2,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-13 12h26M-9 12V2M-2 12V-6M5 12V-1M12 12V-11"/></g><text x="683.2" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Evaluation</text><path d="M637.0 130.0 H729.5" stroke="#1f3f77" stroke-width="1.1"/><text x="683.2" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">MAE, MSE, RMSE</text><path d="M742.5 136.0 H754.5" stroke="#1f3f77" stroke-width="3"/><path d="M752.5 130.0 L761.5 136.0 L752.5 142.0 Z" fill="#1f3f77"/><rect x="763.5" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(819.8,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 11C-11-3-2-12 12-12 12 2 3 11-11 11zM-11 11L4 -4"/></g><text x="819.8" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Yield Forecast</text><path d="M773.5 130.0 H866.0" stroke="#1f3f77" stroke-width="1.1"/><text x="819.8" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Best model</text><text x="819.8" y="162.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">selected</text><rect x="340" y="240" width="550" height="210" fill="#efefef" stroke="#8b7d63" stroke-width="1.6"/><rect x="525.0" y="240" width="180" height="34" fill="#a3833f"/><text x="615.0" y="264.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Key Findings</text><rect x="354" y="286" width="522" height="50" rx="8" fill="#fff" stroke="#9aa3ad"/><text x="366.0" y="305.0" font-size="14" font-weight="700" fill="#1b1f24" text-anchor="start">F1:</text><text x="398.0" y="305.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Supervised models forecast sugarcane yield from weather and</text><text x="366.0" y="323.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">production data.</text><rect x="354" y="344" width="522" height="32" rx="8" fill="#fff" stroke="#9aa3ad"/><text x="366.0" y="363.0" font-size="14" font-weight="700" fill="#1b1f24" text-anchor="start">F2:</text><text x="398.0" y="363.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Gradient boosting (GBR) outperformed the other four regressors.</text><path d="M370 384 H876 V420 H354 Z" fill="#1d5a3a"/><text x="380.0" y="407.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">GBR gives the most accurate sugarcane yield forecasts.</text></svg>