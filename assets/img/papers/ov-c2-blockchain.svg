<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="460" fill="#fff"/><rect x="10" y="10" width="318" height="218" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="89.0" y="10" width="160" height="34" fill="#a3833f"/><text x="169.0" y="34.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Motivation</text><text x="22.0" y="64.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="64.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Online Course Security</text><text x="46.0" y="84.0" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="start">•</text><text x="60.0" y="84.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Course details and payments face</text><text x="60.0" y="102.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">fraud and cyberattacks</text><text x="22.0" y="128.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="128.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Blockchain Underused</text><text x="46.0" y="148.0" font-size="14" font-weight="400" fill="#1b1f24" text-anchor="start">•</text><text x="60.0" y="148.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Few online course platforms use it</text><text x="60.0" y="166.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">to its full potential</text><rect x="10" y="240" width="318" height="210" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="94.0" y="240" width="150" height="34" fill="#a3833f"/><text x="169.0" y="264.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Takeaways</text><text x="22.0" y="296.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="296.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Secure Learning</text><text x="40.0" y="316.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Course content protected on a</text><text x="40.0" y="334.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">tamper-resistant ledger</text><text x="22.0" y="360.0" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="start">❖</text><text x="40.0" y="360.0" font-size="14.5" font-weight="700" fill="#1b1f24" text-anchor="start">Safer Payments</text><text x="40.0" y="380.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Fraudulent transactions flagged</text><text x="40.0" y="398.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">automatically</text><rect x="340" y="10" width="550" height="218" fill="#ffffff" stroke="#8b7d63" stroke-width="1.6"/><rect x="530.0" y="10" width="170" height="34" fill="#a3833f"/><text x="615.0" y="34.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Methodology</text><rect x="350" y="48" width="530" height="176" rx="8" fill="#dbe6f4"/><rect x="354.0" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(410.2,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-13" width="24" height="26" rx="3"/><path d="M-7 -6h14M-7 0h14M-7 6h9"/></g><text x="410.2" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Course Data</text><path d="M364.0 130.0 H456.5" stroke="#1f3f77" stroke-width="1.1"/><text x="410.2" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Titles, modules,</text><text x="410.2" y="162.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">payments</text><path d="M469.5 136.0 H481.5" stroke="#1f3f77" stroke-width="3"/><path d="M479.5 130.0 L488.5 136.0 L479.5 142.0 Z" fill="#1f3f77"/><rect x="490.5" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(546.8,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-6" width="11" height="12" rx="2"/><rect x="3" y="-6" width="11" height="12" rx="2"/><path d="M-3 0h6"/></g><text x="546.8" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Blockchain</text><text x="546.8" y="139.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Ledger</text><path d="M500.5 147.0 H593.0" stroke="#1f3f77" stroke-width="1.1"/><text x="546.8" y="164.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Cryptographic,</text><text x="546.8" y="179.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">decentralized</text><path d="M606.0 136.0 H618.0" stroke="#1f3f77" stroke-width="3"/><path d="M616.0 130.0 L625.0 136.0 L616.0 142.0 Z" fill="#1f3f77"/><rect x="627.0" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(683.2,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-6" cy="0" r="6"/><path d="M0 0h13M9 0v5M13 0v4"/></g><text x="683.2" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">Two Keys</text><path d="M637.0 130.0 H729.5" stroke="#1f3f77" stroke-width="1.1"/><text x="683.2" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Public and</text><text x="683.2" y="162.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">private</text><path d="M742.5 136.0 H754.5" stroke="#1f3f77" stroke-width="3"/><path d="M752.5 130.0 L761.5 136.0 L752.5 142.0 Z" fill="#1f3f77"/><rect x="763.5" y="56" width="112.5" height="160" rx="5" fill="#f7f7f7" stroke="#8f99a6" stroke-width="1.3"/><g transform="translate(819.8,84)" fill="none" stroke="#1f3f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -13l11 4v8c0 7-5 12-11 14-6-2-11-7-11-14v-8z"/><path d="M-5 0l4 4 7-7"/></g><text x="819.8" y="122.0" font-size="13.5" font-weight="700" fill="#1b1f24" text-anchor="middle">ML Fraud Check</text><path d="M773.5 130.0 H866.0" stroke="#1f3f77" stroke-width="1.1"/><text x="819.8" y="147.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">Linear</text><text x="819.8" y="162.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">regression,</text><text x="819.8" y="177.0" font-size="12" font-weight="400" fill="#38414d" text-anchor="middle">random forest</text><rect x="340" y="240" width="550" height="210" fill="#efefef" stroke="#8b7d63" stroke-width="1.6"/><rect x="525.0" y="240" width="180" height="34" fill="#a3833f"/><text x="615.0" y="264.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Key Findings</text><rect x="354" y="286" width="522" height="50" rx="8" fill="#fff" stroke="#9aa3ad"/><text x="366.0" y="305.0" font-size="14" font-weight="700" fill="#1b1f24" text-anchor="start">F1:</text><text x="398.0" y="305.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">A public key secures course titles and descriptions; a private key</text><text x="366.0" y="323.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">secures modules and payments.</text><rect x="354" y="344" width="522" height="32" rx="8" fill="#fff" stroke="#9aa3ad"/><text x="366.0" y="363.0" font-size="14" font-weight="700" fill="#1b1f24" text-anchor="start">F2:</text><text x="398.0" y="363.0" font-size="13.5" font-weight="400" fill="#1b1f24" text-anchor="start">Machine learning models detect fraudulent transactions.</text><path d="M370 384 H876 V440 H354 Z" fill="#1d5a3a"/><text x="380.0" y="407.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Nearly impossible to leak user information without</text><text x="380.0" y="427.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">permission.</text></svg>